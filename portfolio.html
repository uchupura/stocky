<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f4f6">
<title>Stocky · 내 포트폴리오</title>
<meta name="description" content="보유 주식의 평가금액과 수익을 한눈에 보는 포트폴리오 목업 페이지">
<meta property="og:type" content="website">
<meta property="og:title" content="Stocky · 내 포트폴리오">
<meta property="og:description" content="보유 주식의 평가금액과 수익을 한눈에 보는 포트폴리오 목업 페이지">
<meta property="og:locale" content="ko_KR">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #f2f4f6;
    --card: #ffffff;
    --text: #191f28;
    --sub: #8b95a1;
    --line: #f2f4f6;
    --blue: #3182f6;
    --up: #f04452;
    --down: #3182f6;
    --badge-bg: #e8f3ff;
    --badge-text: #1b64da;
    --handle: #c5cbd2;
    --press: #f9fafb;
    --us-bar: #a5cbff;
    --shadow: 0 8px 24px rgba(0, 29, 58, 0.14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101013;
      --card: #17171c;
      --text: #e5e8eb;
      --sub: #7e8590;
      --line: #24242b;
      --badge-bg: #1b2a44;
      --badge-text: #62a4ff;
      --handle: #4e5560;
      --press: #1e1e24;
      --us-bar: #2f5488;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
    letter-spacing: -0.02em;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  body.sorting { user-select: none; -webkit-user-select: none; cursor: grabbing; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }

  /* 데스크톱 전용 요소는 기본(모바일)에서 숨김 */
  .d-only { display: none; }

  /* ===== 상단 바 ===== */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    padding-top: env(safe-area-inset-top);
  }
  .topbar-inner {
    max-width: 480px;
    margin: 0 auto;
    min-height: 56px;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand { font-size: 20px; font-weight: 800; letter-spacing: -0.04em; }
  .brand span { color: var(--blue); }
  .header-actions { display: flex; align-items: center; gap: 4px; }
  .icon-btn {
    width: 40px; height: 40px;
    display: grid; place-items: center;
    border-radius: 12px;
    color: var(--sub);
  }
  .icon-btn:active { background: var(--card); }

  /* ===== 본문 ===== */
  .app {
    max-width: 480px;
    margin: 0 auto;
    padding: 0 12px calc(32px + env(safe-area-inset-bottom));
  }

  .card {
    background: var(--card);
    border-radius: 24px;
    padding: 24px 20px;
    margin-top: 12px;
  }

  /* 요약 */
  .summary .label { font-size: 15px; color: var(--sub); font-weight: 500; }
  .summary .total { font-size: 30px; font-weight: 700; margin-top: 6px; letter-spacing: -0.03em; }
  .summary .total-pl { font-size: 16px; font-weight: 600; margin-top: 4px; }
  .sum-side { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
  .rows .row {
    display: flex; justify-content: space-between;
    font-size: 15px; padding: 6px 0;
  }
  .rows dt { color: var(--sub); }
  .rows dd { font-weight: 600; }

  .alloc { margin-top: 14px; }
  .alloc-bar {
    display: flex;
    height: 8px;
    border-radius: 4px;
    overflow: hidden;
    background: var(--line);
  }
  .alloc-bar .kr { background: var(--blue); }
  .alloc-bar .us { background: var(--us-bar); }
  .alloc-legend {
    display: flex; gap: 16px;
    margin-top: 10px;
    font-size: 13px; color: var(--sub);
  }
  .alloc-legend b { color: var(--text); font-weight: 600; margin-left: 2px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .dot.kr { background: var(--blue); }
  .dot.us { background: var(--us-bar); }

  .up { color: var(--up); }
  .down { color: var(--down); }
  .flat { color: var(--sub); }

  /* 보유 주식 목록 */
  .list-card { padding: 24px 8px 12px; }
  .list-head {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 0 12px 8px;
  }
  .list-head h2 { font-size: 20px; font-weight: 700; }
  .list-head h2 span { color: var(--blue); margin-left: 4px; }
  .list-head .hint { font-size: 13px; color: var(--sub); }

  #list { list-style: none; position: relative; }
  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 4px 14px 12px;
    border-radius: 16px;
    background: var(--card);
    position: relative;
    transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.2s, background 0.15s;
  }
  .item:active:not(.dragging) { background: var(--press); }
  .item.dragging {
    z-index: 5;
    box-shadow: var(--shadow);
    transition: box-shadow 0.2s;
  }
  #list.no-anim .item { transition: none !important; }

  .logo {
    flex: 0 0 auto;
    width: 40px; height: 40px;
    border-radius: 50%;
    display: grid; place-items: center;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
  }
  .info { flex: 1; min-width: 0; }
  .name {
    display: flex; align-items: center; gap: 6px;
    font-size: 16px; font-weight: 600;
  }
  .name .text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge {
    flex: 0 0 auto;
    font-size: 11px;
    font-weight: 700;
    line-height: 1;
    padding: 3px 5px;
    border-radius: 5px;
    background: var(--badge-bg);
    color: var(--badge-text);
    letter-spacing: 0;
  }
  .qty { font-size: 14px; color: var(--sub); margin-top: 3px; }

  .amount { flex: 0 0 auto; text-align: right; }
  .amount .value { font-size: 16px; font-weight: 600; white-space: nowrap; }
  .amount .pl { font-size: 13px; font-weight: 500; margin-top: 3px; white-space: nowrap; }

  .handle {
    flex: 0 0 auto;
    width: 32px; height: 40px;
    display: grid; place-items: center;
    color: var(--handle);
    touch-action: none;
    cursor: grab;
    border-radius: 8px;
  }
  .handle:focus-visible { outline: 2px solid var(--blue); }
  .dragging .handle { color: var(--blue); cursor: grabbing; }

  .foot {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 8px 0;
    font-size: 12px;
    color: var(--sub);
  }
  .foot button { font-size: 12px; color: var(--sub); text-decoration: underline; }

  /* 토스트 */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translate(-50%, 16px);
    background: rgba(25, 31, 40, 0.92);
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    padding: 12px 18px;
    border-radius: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    white-space: nowrap;
    z-index: 20;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ===== 아주 작은 화면 (iPhone SE 등) ===== */
  @media (max-width: 360px) {
    .app { padding-left: 8px; padding-right: 8px; }
    .summary .total { font-size: 26px; }
    .list-card { padding-left: 4px; padding-right: 4px; }
    .item { gap: 8px; padding-left: 10px; padding-right: 0; }
    .logo { width: 34px; height: 34px; font-size: 13px; }
    .name, .amount .value { font-size: 15px; }
    .amount .pl { font-size: 12px; }
    .amount .rate { display: block; } /* 수익률을 수익금 아래 줄로 */
    .handle { width: 26px; }
    .list-head .hint { display: none; }
  }

  /* ===== 태블릿 ===== */
  @media (min-width: 640px) {
    .topbar-inner, .app { max-width: 640px; }
  }

  /* ===== 데스크톱 ===== */
  @media (min-width: 1024px) {
    .d-only { display: block; }
    .m-only { display: none !important; }

    .topbar { background: var(--card); border-bottom: 1px solid var(--line); }
    .topbar-inner {
      max-width: 1120px;
      min-height: 64px;
      padding: 0 32px;
      justify-content: flex-start;
      gap: 48px;
    }
    .nav { display: flex; gap: 32px; font-size: 16px; font-weight: 600; color: var(--sub); }
    .nav a:hover { color: var(--text); }
    .nav a.active { color: var(--text); }
    .header-actions { margin-left: auto; gap: 8px; }
    .search {
      display: flex; align-items: center; gap: 8px;
      width: 280px; height: 40px;
      padding: 0 14px;
      border-radius: 12px;
      background: var(--bg);
      color: var(--sub);
      font-size: 15px;
    }
    .search input {
      flex: 1; min-width: 0;
      border: 0; outline: 0; background: none;
      font: inherit; color: var(--text);
    }

    .app { max-width: 1120px; padding: 32px 32px 56px; }
    .page-title { font-size: 26px; font-weight: 700; padding: 0 4px 4px; }
    .card { padding: 32px; margin-top: 16px; }

    /* 요약: 왼쪽 총액 / 오른쪽 세부 */
    .summary {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 40px;
      align-items: center;
    }
    .summary .total { font-size: 36px; }
    .summary .total-pl { font-size: 18px; }
    .sum-side {
      margin-top: 0;
      padding: 0 0 0 40px;
      border-top: 0;
      border-left: 1px solid var(--line);
    }
    .rows { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .rows .row { flex-direction: column; gap: 6px; padding: 0; }
    .rows dt { font-size: 14px; }
    .rows dd { font-size: 18px; }
    .alloc { margin-top: 20px; }

    /* 목록: 표 형태 */
    .list-card { padding: 28px 20px 16px; }
    .list-head { padding: 0 12px 16px; }
    .list-head h2 { font-size: 22px; }

    .thead, .item {
      display: grid;
      grid-template-columns: 40px minmax(150px, 1fr) 90px 120px 120px 140px 150px 32px;
      gap: 12px;
      align-items: center;
    }
    .thead {
      padding: 0 4px 10px 12px;
      margin-bottom: 4px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      color: var(--sub);
      font-weight: 500;
    }
    .thead .c-name { grid-column: 1 / 3; }
    .thead span { text-align: right; }
    .thead .c-name { text-align: left; }

    .item { padding: 16px 4px 16px 12px; }
    .item:hover:not(.dragging) { background: var(--press); }
    .col { font-size: 15px; text-align: right; white-space: nowrap; }
    .amount { display: contents; } /* value, pl 을 각각 표의 칸으로 */
    .amount .value { text-align: right; }
    .amount .pl { text-align: right; margin-top: 0; font-size: 15px; font-weight: 600; }
    .amount .rate { display: block; font-size: 13px; font-weight: 500; margin-top: 2px; }

    .foot { padding: 20px 8px 0; font-size: 13px; }
    .foot button { font-size: 13px; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">Stocky<span>.</span></div>
    <nav class="nav d-only" aria-label="주 메뉴">
      <a href="#">홈</a>
      <a href="#" class="active">내 투자</a>
      <a href="#">발견</a>
    </nav>
    <div class="header-actions">
      <label class="search d-only">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" placeholder="종목을 검색해보세요" aria-label="종목 검색">
      </label>
      <button class="icon-btn m-only" aria-label="검색">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <button class="icon-btn" aria-label="알림">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="app">
  <h1 class="page-title d-only">내 투자</h1>

  <section class="card summary">
    <div class="sum-main">
      <p class="label">총 평가금액</p>
      <p class="total" id="total">-</p>
      <p class="total-pl" id="totalPl">-</p>
    </div>
    <div class="sum-side">
      <dl class="rows">
        <div class="row"><dt>투자 원금</dt><dd id="cost">-</dd></div>
        <div class="row"><dt>국내 주식</dt><dd id="krTotal">-</dd></div>
        <div class="row"><dt>해외 주식</dt><dd id="usTotal">-</dd></div>
      </dl>
      <div class="alloc">
        <div class="alloc-bar"><span class="kr" id="barKr"></span><span class="us" id="barUs"></span></div>
        <div class="alloc-legend">
          <span><i class="dot kr"></i>국내<b id="pctKr"></b></span>
          <span><i class="dot us"></i>해외<b id="pctUs"></b></span>
        </div>
      </div>
    </div>
  </section>

  <section class="card list-card">
    <div class="list-head">
      <h2>보유 주식<span id="count"></span></h2>
      <span class="hint">≡ 를 끌어서 순서 변경</span>
    </div>
    <div class="thead d-only" aria-hidden="true">
      <span class="c-name">종목</span>
      <span>보유 수량</span>
      <span>평균 단가</span>
      <span>현재가</span>
      <span>평가금액</span>
      <span>수익금 (수익률)</span>
      <span></span>
    </div>
    <ul id="list"></ul>
  </section>

  <div class="foot">
    <span id="fxNote"></span>
    <button id="resetBtn">순서 초기화</button>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  // ===== 목업 데이터 =====
  const FX = 1385; // 1 USD = 1,385원 (가정)

  const STOCKS = [
    { id: 'samsung', name: '삼성전자',   cur: 'KRW', qty: 50, avg: 68000,  price: 74500,  color: '#1428a0' },
    { id: 'aapl',    name: 'Apple',      cur: 'USD', qty: 15, avg: 172.3,  price: 228.4,  color: '#333d4b' },
    { id: 'nvda',    name: 'NVIDIA',     cur: 'USD', qty: 30, avg: 98.5,   price: 141.2,  color: '#76b900' },
    { id: 'hynix',   name: 'SK하이닉스', cur: 'KRW', qty: 10, avg: 182000, price: 211000, color: '#ea002c' },
    { id: 'tsla',    name: 'Tesla',      cur: 'USD', qty: 6,  avg: 265.0,  price: 238.1,  color: '#cc0000' },
    { id: 'naver',   name: 'NAVER',      cur: 'KRW', qty: 8,  avg: 215000, price: 188500, color: '#03c75a' },
    { id: 'msft',    name: 'Microsoft',  cur: 'USD', qty: 4,  avg: 395.0,  price: 421.8,  color: '#00a4ef' },
    { id: 'kakao',   name: '카카오',     cur: 'KRW', qty: 20, avg: 52000,  price: 41200,  color: '#f7c600' },
    { id: 'hyundai', name: '현대차',     cur: 'KRW', qty: 5,  avg: 245000, price: 251500, color: '#002c5f' },
  ];

  const ORDER_KEY = 'stocky-order';
  const byId = Object.fromEntries(STOCKS.map(s => [s.id, s]));

  // ===== 계산/포맷 =====
  const fmt = n => Math.round(n).toLocaleString('ko-KR');
  const signed = n => (n > 0 ? '+' : n < 0 ? '-' : '') + fmt(Math.abs(n));
  const tone = n => (n > 0 ? 'up' : n < 0 ? 'down' : 'flat');
  const rateText = r => `(${r > 0 ? '+' : ''}${r.toFixed(1)}%)`;
  // 단가: 미국 주식은 달러, 국내 주식은 원
  const unitPrice = (s, v) => (s.cur === 'USD' ? `$${v.toFixed(2)}` : `${fmt(v)}원`);

  function calc(s) {
    const rate = s.cur === 'USD' ? FX : 1;
    const value = s.qty * s.price * rate;
    const cost = s.qty * s.avg * rate;
    return { value, cost, pl: value - cost, rate: ((value - cost) / cost) * 100 };
  }

  // ===== 순서 저장/불러오기 =====
  function loadOrder() {
    let saved = [];
    try { saved = JSON.parse(localStorage.getItem(ORDER_KEY)) || []; } catch (e) {}
    const valid = saved.filter(id => byId[id]);
    const missing = STOCKS.map(s => s.id).filter(id => !valid.includes(id));
    return [...valid, ...missing];
  }
  function saveOrder() {
    const ids = [...list.children].map(li => li.dataset.id);
    try { localStorage.setItem(ORDER_KEY, JSON.stringify(ids)); } catch (e) {}
  }

  // ===== 렌더링 =====
  const list = document.getElementById('list');
  const $ = id => document.getElementById(id);

  function renderSummary() {
    let value = 0, cost = 0, kr = 0, us = 0;
    STOCKS.forEach(s => {
      const c = calc(s);
      value += c.value; cost += c.cost;
      if (s.cur === 'USD') us += c.value; else kr += c.value;
    });
    const pl = value - cost;
    const pctKr = (kr / value) * 100;
    $('total').textContent = `${fmt(value)}원`;
    $('totalPl').textContent = `${signed(pl)}원 ${rateText((pl / cost) * 100)}`;
    $('totalPl').className = `total-pl ${tone(pl)}`;
    $('cost').textContent = `${fmt(cost)}원`;
    $('krTotal').textContent = `${fmt(kr)}원`;
    $('usTotal').textContent = `${fmt(us)}원`;
    $('barKr').style.width = `${pctKr}%`;
    $('barUs').style.width = `${100 - pctKr}%`;
    $('pctKr').textContent = `${pctKr.toFixed(1)}%`;
    $('pctUs').textContent = `${(100 - pctKr).toFixed(1)}%`;
    $('count').textContent = STOCKS.length;
    $('fxNote').textContent = `※ 목업 데이터 · 1달러 = ${fmt(FX)}원 기준`;
  }

  function renderList() {
    list.innerHTML = loadOrder().map(id => {
      const s = byId[id];
      const c = calc(s);
      const badge = s.cur === 'USD' ? '<span class="badge">USD</span>' : '';
      return `
        <li class="item" data-id="${s.id}">
          <div class="logo" style="background:${s.color}">${s.name[0]}</div>
          <div class="info">
            <div class="name"><span class="text">${s.name}</span>${badge}</div>
            <div class="qty m-only">${s.qty}주</div>
          </div>
          <div class="col d-only">${s.qty}주</div>
          <div class="col d-only">${unitPrice(s, s.avg)}</div>
          <div class="col d-only">${unitPrice(s, s.price)}</div>
          <div class="amount">
            <div class="value">${fmt(c.value)}원</div>
            <div class="pl ${tone(c.pl)}">${signed(c.pl)}원 <span class="rate">${rateText(c.rate)}</span></div>
          </div>
          <button class="handle" aria-label="${s.name} 순서 변경 (위/아래 화살표 키)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
        </li>`;
    }).join('');
  }

  // ===== 토스트 =====
  let toastTimer;
  function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
  }

  // ===== 드래그 앤 드롭 (마우스 + 터치 공용, Pointer Events) =====
  let drag = null;

  list.addEventListener('pointerdown', e => {
    const handle = e.target.closest('.handle');
    if (!handle || drag) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();

    const item = handle.closest('.item');
    const items = [...list.children];
    const from = items.indexOf(item);
    // 페이지 기준 좌표로 저장 (드래그 중 스크롤돼도 계산이 맞도록)
    const slots = items.map(el => {
      const r = el.getBoundingClientRect();
      return { top: r.top + scrollY, h: r.height };
    });

    drag = { item, handle, items, from, to: from, slots, pointerId: e.pointerId,
             startY: e.clientY + scrollY, clientY: e.clientY, raf: 0 };

    handle.setPointerCapture(e.pointerId);
    item.classList.add('dragging');
    document.body.classList.add('sorting');
    if (navigator.vibrate) navigator.vibrate(10);
    drag.raf = requestAnimationFrame(autoScroll);
  });

  list.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.pointerId) return;
    drag.clientY = e.clientY;
    updateDrag();
  });

  list.addEventListener('pointerup', endDrag);
  list.addEventListener('pointercancel', endDrag);

  function updateDrag() {
    const { item, items, from, slots } = drag;
    const me = slots[from];
    const first = slots[0].top;
    const last = slots[slots.length - 1].top + slots[slots.length - 1].h - me.h;

    let dy = drag.clientY + scrollY - drag.startY;
    dy = Math.max(first - me.top, Math.min(last - me.top, dy)); // 목록 밖으로 못 나가게
    item.style.transform = `translateY(${dy}px) scale(1.02)`;

    // 끌고 있는 카드의 중심보다 위에 있는 다른 카드 수 = 새 위치
    const center = me.top + me.h / 2 + dy;
    let to = 0;
    slots.forEach((s, i) => { if (i !== from && s.top + s.h / 2 < center) to++; });

    // 사이에 있는 카드들을 한 칸씩 밀어 자리 만들기
    items.forEach((el, i) => {
      if (i === from) return;
      let shift = 0;
      if (i > from && i <= to) shift = -me.h;
      else if (i < from && i >= to) shift = me.h;
      el.style.transform = shift ? `translateY(${shift}px)` : '';
    });
    drag.to = to;
  }

  function autoScroll() {
    if (!drag) return;
    const edgeTop = 110, edgeBottom = 80;
    const y = drag.clientY, h = innerHeight;
    let v = 0;
    if (y < edgeTop) v = -Math.min(14, (edgeTop - y) / 5);
    else if (y > h - edgeBottom) v = Math.min(14, (y - (h - edgeBottom)) / 5);
    if (v) { scrollBy(0, v); updateDrag(); }
    drag.raf = requestAnimationFrame(autoScroll);
  }

  function endDrag(e) {
    if (!drag || e.pointerId !== drag.pointerId) return;
    const { item, items, from, to } = drag;
    cancelAnimationFrame(drag.raf);

    const before = item.getBoundingClientRect().top;
    list.classList.add('no-anim');
    items.forEach(el => (el.style.transform = ''));
    if (to !== from) {
      list.insertBefore(item, to > from ? items[to].nextSibling : items[to]);
    }
    // 놓은 위치에서 제자리로 부드럽게 내려앉는 애니메이션 (FLIP)
    const after = item.getBoundingClientRect().top;
    item.style.transform = `translateY(${before - after}px)`;
    void item.offsetHeight;
    list.classList.remove('no-anim');
    item.classList.remove('dragging');
    item.style.transform = '';
    document.body.classList.remove('sorting');

    drag = null;
    if (to !== from) { saveOrder(); toast('순서를 바꿨어요'); }
  }

  // 키보드로도 순서 변경 (접근성): 손잡이에 포커스 후 ↑ / ↓
  list.addEventListener('keydown', e => {
    const handle = e.target.closest('.handle');
    if (!handle || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
    e.preventDefault();
    const item = handle.closest('.item');
    if (e.key === 'ArrowUp' && item.previousElementSibling) {
      list.insertBefore(item, item.previousElementSibling);
    } else if (e.key === 'ArrowDown' && item.nextElementSibling) {
      list.insertBefore(item.nextElementSibling, item);
    } else return;
    handle.focus();
    saveOrder();
    toast('순서를 바꿨어요');
  });

  $('resetBtn').addEventListener('click', () => {
    try { localStorage.removeItem(ORDER_KEY); } catch (e) {}
    renderList();
    toast('기본 순서로 되돌렸어요');
  });

  renderSummary();
  renderList();
</script>
</body>
</html>
